<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Folio — A simple library management system: book & user management, borrowing, renewing, returning, and overdue fine tracking.">
  <title>Folio — Library Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

      <div class="brand-mark">F</div>
      <div>

      </div>
    </div>

    <nav>

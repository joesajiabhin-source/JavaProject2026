# Dedicated MySQL database for tests. Never point this URL at production data.
spring.datasource.url=${TEST_MYSQL_URL:jdbc:mysql://localhost:3306/librarydb_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_MYSQL_USER:root}
spring.datasource.password=${TEST_MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create missing tables. Test classes reset and seed them before they run.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql

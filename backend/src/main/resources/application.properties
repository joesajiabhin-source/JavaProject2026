spring.application.name=Folio Library Manager
server.port=${PORT:8080}

# MySQL database. Override these environment variables for your deployment.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql and data.sql only when explicitly requested, for example on a
# new local database: SPRING_SQL_INIT_MODE=always.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8
